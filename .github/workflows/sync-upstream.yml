name: Sync reviewed upstream source
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit SHA on architecture-actions-public main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Export selected upstream commit
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git clone --no-checkout https://github.com/JACKT72xp/architecture-actions-public.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" merge-base --is-ancestor "$SOURCE_SHA" origin/main
          python .github/scripts/sync_upstream.py --source "$RUNNER_TEMP/upstream" --ref "$SOURCE_SHA"
          python .github/scripts/sync_upstream.py --source "$RUNNER_TEMP/upstream" --check
      - name: Open synchronization pull request
        run: |
          if test -z "$(git status --porcelain)"; then
            echo 'Already synchronized.'
            exit 0
          fi
          branch="sync/upstream-$SOURCE_SHA"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Sync arc42 TQI from upstream $SOURCE_SHA"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Import the arc42-tqi subtree from https://github.com/JACKT72xp/architecture-actions-public/commit/$SOURCE_SHA.

          UPSTREAM.json records the source commit and exported file hashes.
          Run the Validate distribution workflow on this branch before merging:
          pushes and pull requests created with GITHUB_TOKEN do not trigger normal CI events.
          EOF
          gh pr create --head "$branch" --title "Sync upstream $SOURCE_SHA" --body-file "$RUNNER_TEMP/pr-body.md"
          gh workflow run ci.yml --ref "$branch"
